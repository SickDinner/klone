name: Research health regression

on:
  push:
    branches:
      - main
      - "feature/research-health-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-health:
    name: Research health / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install KLONE
        run: python -m pip install --no-cache-dir -e .
      - name: Run read-only research health regression tests
        run: python -m unittest discover -s tests -p test_research_health_cli.py -v
