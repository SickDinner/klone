name: KLONE regression guard

on:
  pull_request:
  push:
    branches:
      - main
      - hypervisor-runtime-contract

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Phase 2B.3 correction and replay regression
        run: python -m unittest tests.test_memory_phase_2b3 -v

      - name: Hypervisor runtime contract regression
        run: python -m unittest tests.test_hypervisor_runtime_contract -v

      - name: Architecture coherence regression
        run: python -m unittest tests.test_architecture_coherence -v

      - name: Full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
