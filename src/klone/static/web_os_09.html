<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1221"><title>KLONE NEXT 0.9</title><style>
:root{color-scheme:dark;--bg:#090f1c;--panel:#141f32;--line:#30435f;--text:#edf4ff;--muted:#a5b8d2;--accent:#69b8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}header{position:sticky;top:0;background:#101a2c;border-bottom:1px solid var(--line);padding:16px;z-index:2}h1{font-size:22px;margin:0}small,.muted{color:var(--muted)}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#0d1627;position:sticky;top:69px;z-index:2}button,select,input{font:inherit;color:var(--text);background:#1c2c44;border:1px solid #496281;border-radius:10px;padding:10px}button{cursor:pointer}button.active,button.primary{background:#245d95;border-color:#83c6ff}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #91d0ff}main{padding:16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:12px;overflow-wrap:anywhere}.card h2{font-size:18px;margin:0 0 12px}.card h3{font-size:16px}.metric{font-size:28px;font-weight:700}.ok{color:#88e0b1}.warn{color:#ffd38a}.err{color:#ff9c9c}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#0b1424;padding:12px;border-radius:9px;max-height:380px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}label{display:block;margin:9px 0 5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{border:1px solid #47607b;border-radius:99px;padding:4px 8px;color:#b9d5f0;font-size:12px}#status{font-size:12px;color:var(--muted);margin-top:6px}.hidden{display:none!important}a{color:#8ac9ff}footer{padding:24px;color:var(--muted);text-align:center} @media(max-width:520px){header{padding:12px}nav{top:61px}main{padding:10px}.card{padding:13px}}
</style></head><body><header><h1>KLONE // NEXT <span class="tag">0.9</span></h1><div id="status" aria-live="polite">Paikallinen hallinta · lukuoikeudet · kokeellinen kognitiolaboratorio</div></header><nav id="nav" aria-label="Moduulit"></nav><main id="app"></main><footer>KLONE 0.9 · Ei maksullista API:a · Ei väitettä koneellisesta tietoisuudesta</footer><script>
'use strict';
const modules=[['overview','Yleiskuva'],['memory','Muisti'],['agents','Agentit'],['rooms','Huoneet'],['security','Turva'],['media','Media'],['simulation','Simulaatio'],['cognition','Kognitio'],['tests','Testit'],['settings','Asetukset']];
const endpoints={health:'/api/health',status:'/api/status',modules:'/api/modules',agents:'/api/agents',rooms:'/api/rooms',permissions:'/api/permission-levels',guards:'/api/governance/guards',constitution:'/api/constitution',audit:'/api/audit',datasets:'/api/datasets',assets:'/api/assets',board:'/api/simulation/hybrid-board',world:'/api/simulation/world-memory'};
const app=document.getElementById('app'),nav=document.getElementById('nav'),status=document.getElementById('status');let current='overview';let state={step:0,attention:0,energy:80,uncertainty:60,trace:[],goal:'Tutki ympäristöä',observations:0};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(title,body){return `<section class="card"><h2>${esc(title)}</h2>${body}</section>`}
function obj(x){return `<pre>${esc(JSON.stringify(x,null,2))}</pre>`}
function rows(x){if(Array.isArray(x))return x;if(x&&typeof x==='object'){for(const k of ['items','results','rooms','agents','modules','events','entities','episodes','datasets','assets','entries','records'])if(Array.isArray(x[k]))return x[k];}return null}
function dataView(x){const arr=rows(x);if(arr){if(!arr.length)return '<p class="muted">Ei tietueita tässä vastauksessa.</p>';return `<div class="grid">${arr.slice(0,100).map((r,i)=>card(r.name||r.id||r.title||`Tietue ${i+1}`,obj(r))).join('')}</div>${arr.length>100?'<p>Näytetään ensimmäiset 100 tietuetta.</p>':''}`}return obj(x)}
async function get(path){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);try{const r=await fetch(path,{signal:ctl.signal,cache:'no-store',credentials:'same-origin',headers:{'Accept':'application/json'}});const t=await r.text();let value;try{value=JSON.parse(t)}catch{value=t.slice(0,3000)}if(!r.ok)throw Error(`HTTP ${r.status}: ${typeof value==='string'?value:JSON.stringify(value).slice(0,250)}`);return value}finally{clearTimeout(timer)}}
async function slot(id,path,transform=dataView){const el=document.getElementById(id);if(!el)return;el.textContent='Ladataan…';try{const x=await get(path);if(document.getElementById(id)===el)el.innerHTML=transform(x)}catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`}}
function block(id,title){return card(title,`<div id="${id}" aria-live="polite">Ladataan…</div>`)}
function simple(list){app.innerHTML=list.map(([id,title,key])=>block(id,title)).join('');list.forEach(([id,,key])=>slot(id,endpoints[key]))}
function setPage(page){current=modules.some(m=>m[0]===page)?page:'overview';nav.innerHTML=modules.map(([id,label])=>`<button type="button" data-page="${id}" class="${current===id?'active':''}" aria-current="${current===id?'page':'false'}">${label}</button>`).join('');status.textContent='Näkymä: '+modules.find(x=>x[0]===current)[1]+' · vain luku';if(current==='overview'){app.innerHTML=`<div class="grid">${block('health','Palvelimen terveys')}${block('summary','Järjestelmän tila')}</div>${block('mods','Moduulit')}`;slot('health',endpoints.health,x=>`<div class="metric ${x.status==='ok'?'ok':'warn'}">${esc(x.status||'Tuntematon')}</div><p>Versio: ${esc(x.app_version)}</p><p>Tietokannan skeema: ${esc(x.schema_user_version)}</p><details><summary>Raakatiedot</summary>${obj(x)}</details>`);slot('summary',endpoints.status);slot('mods',endpoints.modules)}
if(current==='memory'){app.innerHTML=card('Muistihuone',`<label for="room">Huone</label><div class="row"><select id="room"><option value="">Ladataan huoneet…</option></select><button id="loadmemory" class="primary">Hae muistia</button></div><p class="muted">Vain luku. Rajapinta edellyttää room_id-arvoa.</p>`)+block('events','Tapahtumat')+block('entities','Entiteetit')+block('episodes','Episodit');slot('room','/api/rooms',x=>{const r=rows(x)||[];return r.map(y=>`<option value="${esc(y.id||y.room_id)}">${esc(y.name||y.id||y.room_id)}</option>`).join('')||'<option value="">Huoneita ei löytynyt</option>'}).then?.(()=>{});document.getElementById('loadmemory').onclick=()=>{const id=document.getElementById('room').value;if(!id)return;['events','entities','episodes'].forEach(k=>slot(k,`/api/memory/${k}?room_id=${encodeURIComponent(id)}`))};}
if(current==='agents')simple([['agents-data','Agentit','agents']]);if(current==='rooms')simple([['rooms-data','Huoneet','rooms'],['perm-data','Oikeustasot','permissions']]);if(current==='security')simple([['guards-data','Valvojat','guards'],['constitution-data','Constitution','constitution'],['audit-data','Audit-loki','audit']]);if(current==='media')simple([['datasets-data','Aineistot','datasets'],['assets-data','Mediatietueet','assets']]);if(current==='simulation')simple([['board-data','Hybridilauta','board'],['world-data','Maailmanmuisti','world']]);if(current==='cognition')cognition();if(current==='tests')tests();if(current==='settings')settings();}
nav.onclick=e=>{const b=e.target.closest('button[data-page]');if(b)location.hash=b.dataset.page};window.addEventListener('hashchange',()=>setPage(location.hash.slice(1)));
function cognition(){app.innerHTML=card('Kokeellinen kognitiolaboratorio',`<p>Havainnollistava paikallinen tilakone. Ei kielimallia, ei itsenäistä tietoisuutta, ei pääsyä KLONEn muistiin tai oikeuksiin.</p><p class="muted">Tavoite: testata sisäisen tilan, tarkkaavaisuuden, epävarmuuden ja toimintalokin vuorovaikutusta.</p><div class="row"><button id="step" class="primary">Suorita yksi askel</button><button id="ten">10 askelta</button><button id="reset">Nollaa</button><button id="export">Vie loki</button></div>`)+`<div id="cog-state"></div>`+card('Tutkimuskysymykset','<p>1. Säilyykö oma tila johdonmukaisena? 2. Ohjaako huomio havaintoja? 3. Pystyykö järjestelmä kuvaamaan epävarmuuttaan? 4. Erottuvatko oma malli ja ulkoinen maailma?</p><p class="warn">Mikään näistä ei yksin osoita subjektiivista kokemusta.</p>');document.getElementById('step').onclick=()=>advance(1);document.getElementById('ten').onclick=()=>advance(10);document.getElementById('reset').onclick=()=>{state={step:0,attention:0,energy:80,uncertainty:60,trace:[],goal:'Tutki ympäristöä',observations:0};drawCog()};document.getElementById('export').onclick=()=>download('klone-cognition-log.json',JSON.stringify(state,null,2));drawCog()}
function advance(n){for(let i=0;i<n;i++){state.step++;const signal=(state.step*37+11)%101;state.attention=Math.round(.65*state.attention+.35*signal);state.uncertainty=Math.max(0,Math.min(100,state.uncertainty+(signal>65?-5:3)));state.energy=Math.max(0,state.energy-2);state.observations++;const action=state.energy<20?'Lepotilan tarve':state.uncertainty>70?'Kerää lisähavainto':'Päivitä sisäinen malli';state.trace.push({step:state.step,signal,attention:state.attention,uncertainty:state.uncertainty,energy:state.energy,action});if(state.trace.length>500)state.trace.shift()}drawCog()}
function drawCog(){const el=document.getElementById('cog-state');if(!el)return;el.innerHTML=`<div class="grid">${[['Askel',state.step],['Tarkkaavaisuus',state.attention+'/100'],['Epävarmuus',state.uncertainty+'/100'],['Energia',state.energy+'/100']].map(([k,v])=>card(k,`<div class="metric">${esc(v)}</div>`)).join('')}</div>`+card('Sisäinen tapahtumaloki',obj(state.trace.slice(-12)))}
function tests(){app.innerHTML=card('Rajapintojen tarkistus',`<button id="run" class="primary">Suorita 13 GET-testiä</button><p>Testit eivät muuta tietokantaa.</p><div id="testresults"></div>`);document.getElementById('run').onclick=async()=>{const el=document.getElementById('testresults');el.textContent='Testataan…';const results=[];for(const [key,path]of Object.entries(endpoints)){try{await get(path);results.push({endpoint:path,result:'OK'})}catch(e){results.push({endpoint:path,result:e.message})}}el.innerHTML=`<p>${results.filter(x=>x.result==='OK').length}/${results.length} onnistui</p><table><thead><tr><th>Rajapinta</th><th>Tulos</th></tr></thead><tbody>${results.map(x=>`<tr><td>${esc(x.endpoint)}</td><td>${esc(x.result)}</td></tr>`).join('')}</tbody></table>`}}
function download(name,data){const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function settings(){app.innerHTML=card('Asetukset',`<p>KLONE 0.9 toimii saman alkuperän API-kutsuilla. Ei kirjoitusoperaatioita.</p><button id="exporthealth">Vie terveystiedot JSON</button><p id="settingstatus" aria-live="polite"></p>`);document.getElementById('exporthealth').onclick=async()=>{try{download('klone-health.json',JSON.stringify(await get(endpoints.health),null,2));document.getElementById('settingstatus').textContent='Tiedosto muodostettu.'}catch(e){document.getElementById('settingstatus').textContent=e.message}}}
setPage(location.hash.slice(1));
</script></body></html>
