name: KLONE regression guard

on:
  pull_request:
  push:
    branches:
      - main
      - hypervisor-runtime-contract
      - feat/security-s1-deny-default-core

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile package and tests
        run: python -m compileall -q src tests

      - name: Phase 2B.3 correction and replay regression
        run: python -m unittest discover -s tests -p "test_memory_phase_2b3.py" -v

      - name: Hypervisor runtime contract regression
        run: python -m unittest discover -s tests -p "test_hypervisor_runtime_contract.py" -v

      - name: Architecture coherence regression
        run: python -m unittest discover -s tests -p "test_architecture_coherence.py" -v

      - name: Full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Write CI evidence manifest
        if: always()
        shell: bash
        env:
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          CI_JOB_STATUS: ${{ job.status }}
          CI_OS: ${{ matrix.os }}
          CI_PYTHON: ${{ matrix.python-version }}
        run: |
          python -c 'import json, os, pathlib; pathlib.Path("ci-evidence.json").write_text(json.dumps({"schema_version": 1, "source": "github_actions", "run_id": os.environ["CI_RUN_ID"], "run_attempt": os.environ["CI_RUN_ATTEMPT"], "commit": os.environ["CI_SHA"], "ref": os.environ["CI_REF"], "status": os.environ["CI_JOB_STATUS"], "os": os.environ["CI_OS"], "python": os.environ["CI_PYTHON"]}, sort_keys=True, indent=2) + "\\n", encoding="utf-8")'

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klone-ci-evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ci-evidence.json
          retention-days: 30
